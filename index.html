        }
        h2 {

        .player-sticky {

            margin-bottom: 25px;

            font-weight: 600;
            margin-bottom: 12px;
            color: #f1c40f;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        audio {

        }
        ul.playlist {

            padding: 0;
            margin: 10px 0 0 0;
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }
        ul.playlist li {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
        }
        ul.playlist li:hover {
            background-color: #f8f9fa;
        }
        ul.playlist li.active {
            background-color: #e3f2fd;
            color: #1565c0;
            font-weight: 600;
        }
        ul.playlist li:last-child {

    const player = document.getElementById('audio-player');
    const titleDisplay = document.getElementById('now-playing');

    function montarLista(items, elementId) {
        const ul = document.getElementById(elementId);
        items.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item.title;
            li.onclick = () => {
                document.querySelectorAll('ul.playlist li').forEach(el => el.classList.remove('active'));
                li.classList.add('active');
                titleDisplay.textContent = item.title;
                player.src = item.file;
                player.play();
            };
            ul.appendChild(li);
        });
    }

    montarLista(antologia, 'list-antologia');
